[project]
name = "plainpaper-detector"
version = "0.1.0"
description = "Training tool for Plainpaper's on-device document detection model (not shipped)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "opencv-python-headless==4.13.*",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "pyyaml>=6.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
