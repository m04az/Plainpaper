name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  ORG_GRADLE_PROJECT_ci: "true"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Formatting and static analysis
        run: ./gradlew spotlessCheck detekt --no-daemon
      - name: No hard-coded user-visible strings
        run: scripts/check-hardcoded-strings.sh
      - name: Native sources are clang-format clean
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          scripts/check-native-format.sh
      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/*.html"
          if-no-files-found: ignore

  test-android:
    name: test-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests (JVM host) and coverage gate
        run: ./gradlew testAndroidHostTest koverXmlReport koverVerify --continue
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Android unit tests
          path: "**/build/test-results/testAndroidHostTest/*.xml"
          reporter: java-junit
          fail-on-error: false
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: |
            build/reports/kover/report.xml
            build/reports/kover/html
          if-no-files-found: ignore

  build-android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache OpenCV downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/plainpaper/downloads
          key: plainpaper-downloads-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install NDK and CMake for the scan engine
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;3.22.1" > /dev/null
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  test-ios:
    name: test-ios
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache OpenCV downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/plainpaper/downloads
          key: plainpaper-downloads-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: iOS simulator unit tests
        run: ./gradlew iosSimulatorArm64Test --continue
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: iOS unit tests
          path: "**/build/test-results/iosSimulatorArm64Test/*.xml"
          reporter: java-junit
          fail-on-error: false

  build-ios:
    name: build-ios
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache OpenCV downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/plainpaper/downloads
          key: plainpaper-downloads-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Warm up Kotlin/Native and Gradle caches
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Build iOS app (simulator)
        # The "Compile Kotlin Framework" run-script phase in the Xcode project runs
        # ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode, which places ComposeApp.framework
        # under composeApp/build/xcode-frameworks/<CONFIGURATION>/<SDK_NAME>.
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  scan-quality:
    name: scan-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            engine:
              - 'core/scanengine/**'
              - 'core/scanengine-android/**'
              - 'core/domain/**'
              - 'core/testing/**'
              - 'tools/scansuite/**'
              - 'reference-set/**'
              - 'scripts/build-opencv-host.sh'
              - 'build-logic/**'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/pr.yml'
      - name: Install Tesseract (ara, eng, fra) and Ninja
        if: steps.changes.outputs.engine == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara tesseract-ocr-fra ninja-build
      - name: Cache host OpenCV
        if: steps.changes.outputs.engine == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/plainpaper/opencv-4.13.0-linux-x86_64
          key: opencv-host-4.13.0-${{ hashFiles('scripts/build-opencv-host.sh') }}
      - name: Build host OpenCV (cache miss only)
        if: steps.changes.outputs.engine == 'true'
        run: scripts/build-opencv-host.sh
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.engine == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.engine == 'true'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Reference quality suite (gate)
        if: steps.changes.outputs.engine == 'true'
        env:
          PP_REQUIRE_OCR: "1"
        run: ./gradlew :tools:scansuite:test
      - name: Quality report
        if: always() && steps.changes.outputs.engine == 'true'
        run: |
          if [ -f build/scansuite/report.md ]; then cat build/scansuite/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload quality report
        if: always() && steps.changes.outputs.engine == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scan-quality-report
          path: |
            build/scansuite/report.md
            build/scansuite/report.json
            build/scansuite/outputs/*.png
          if-no-files-found: ignore
      - name: Skipped
        if: steps.changes.outputs.engine != 'true'
        run: echo "No scan-engine changes; quality suite skipped" >> "$GITHUB_STEP_SUMMARY"
