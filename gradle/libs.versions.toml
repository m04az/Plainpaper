[versions]
# Toolchain (research.md R1)
kotlin = "2.4.21"
agp = "9.3.1"
composeMultiplatform = "1.12.2"
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"

# JetBrains multiplatform androidx forks (R3)
jetbrainsLifecycle = "2.11.0"
jetbrainsNavigation = "2.10.0-rc01"

# kotlinx
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"

# DI, storage (R4, R5)
koin = "4.2.2"
datastore = "1.3.0"
okio = "3.18.2"

# Android host only
activityCompose = "1.13.0"
androidxCore = "1.19.1"

# Test
turbine = "1.2.1"

# Quality (R9)
kover = "0.9.11"
detekt = "1.23.8"
spotless = "8.10.4"
ktlint = "1.8.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrainsNavigation" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Gradle plugins as libraries, for build-logic
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin-compose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
plugin-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
plugin-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

[bundles]
koin = ["koin-core", "koin-compose", "koin-compose-viewmodel"]
lifecycle = ["jetbrains-lifecycle-viewmodel-compose", "jetbrains-lifecycle-runtime-compose"]

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins (build-logic)
plainpaper-kmp-library = { id = "plainpaper.kmp.library" }
plainpaper-kmp-compose = { id = "plainpaper.kmp.compose" }
plainpaper-kmp-feature = { id = "plainpaper.kmp.feature" }
plainpaper-spotless = { id = "plainpaper.spotless" }
plainpaper-detekt = { id = "plainpaper.detekt" }
plainpaper-kover = { id = "plainpaper.kover" }
