# Plainpaper detekt configuration (buildUponDefaultConfig = true; only deltas listed).

build:
  maxIssues: 0

style:
  MaxLineLength:
    active: false # ktlint owns line length (120, .editorconfig)
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    # Developer tooling full of pixel math (metrics, synthetic rendering) is exempt.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**',
               '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/tools/scansuite/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: false
  WildcardImport:
    active: true
    excludeImports: []

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 7
    constructorThreshold: 8
  LongMethod:
    ignoreAnnotated: ['Composable']
    threshold: 80
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInObjects: 15
